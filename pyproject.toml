[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bench_3d_fit"
version = "0.1.0"
description = "3D-Fit Benchmark: scoring and evaluation framework for 3D generative chemistry models"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "", email = ""}
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Chemistry",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
]
dependencies = [
    "numpy>=1.22",
    "pandas>=1.5.0",
    "rdkit>=2022.03.1",
    "scipy>=1.7.0",
    "espsim>=0.0.1",
    "pmapper>=1.0.0",
    "prody>=2.0.0",
    "prolif==2.1.0",
    "posebusters==0.6.5",
    "unidock_tools @ git+https://github.com/dptech-corp/Uni-Dock.git#subdirectory=unidock_tools",
]

[tool.setuptools.packages.find]
include = ["bench_3d_fit*"]
