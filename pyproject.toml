[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bench_3d_fit"
version = "0.2.0"
description = "3D-Fit Benchmark: scoring and evaluation framework for 3D generative chemistry models"
readme = "README.md"
requires-python = ">=3.9"
license = {file = "LICENSE"}
authors = [
    {name = "Tom MacDougall", email = "t.macdougall@insilicomedicine.com"}
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Chemistry",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Programming Language :: Python :: 3",
]
dependencies = [
    "numpy>=1.22",
    "pandas>=1.5.0",
    "rdkit>=2022.03.1",
    "scipy>=1.7.0",
    "espsim>=0.0.1",
    "pmapper>=1.0.0",
    "prody>=2.0.0",
    "prolif>=2.0.0",
    "posebusters>=0.6.0",
    "unidock_tools @ git+https://github.com/dptech-corp/Uni-Dock.git#subdirectory=unidock_tools",
]

[tool.setuptools.packages.find]
include = ["bench_3d_fit*"]

[tool.setuptools.package-data]
bench_3d_fit = ["configs/*.yml"]

[tool.setuptools.data-files]
"data" = ["data/README.md"]
"data/test_sets" = [
    "data/test_sets/README.md",
    "data/test_sets/crossdocked.parquet",
    "data/test_sets/plinder.parquet",
]
"data/novelty_reference" = [
    "data/novelty_reference/README.md",
    "data/novelty_reference/crossdocked_unique.txt",
    "data/novelty_reference/plinder_unique.txt",
]
